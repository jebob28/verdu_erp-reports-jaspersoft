# application-homolog.properties
spring.application.name=reports-jaspersoft

# Database - VARIÁVEIS DE AMBIENTE
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${SERVER_PORT:8013}
server.address=0.0.0.0


# HikariCP - Connection Pool (OTIMIZADO)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000


# PostgreSQL JDBC Driver - Timeouts e Keepalive
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.datasource.hikari.data-source-properties.loginTimeout=10
spring.datasource.hikari.data-source-properties.connectTimeout=10
# MinIO - VARIÁVEIS DE AMBIENTE
minio.endpoint=${MINIO_ENDPOINT}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}

# Audit
audit.enabled=${AUDIT_ENABLED:true}
logs.api.url=${LOGS_API_URL}

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.serialization.write-date-timestamps-as-nanoseconds=false
spring.jackson.deserialization.read-date-timestamps-as-nanoseconds=false
spring.jackson.time-zone=America/Sao_Paulo

# Tomcat
server.tomcat.relaxed-query-chars=[,],|,{,},^,`,",<,>
server.tomcat.relaxed-path-chars=[,],|,{,},^,`,",<,>

# DevTools OFF
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Timezone
app.timezone=America/Sao_Paulo

# Logging
logging.level.root=${LOG_LEVEL:INFO}
logging.level.org.springframework=${SPRING_LOG_LEVEL:INFO}
logging.file.name=${LOG_FILE:logs/reports-jaspersoft.log}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Prometheus
management.metrics.tags.application=reports-jaspersoft
management.metrics.distribution.percentiles.http.server.requests=0.5,0.9,0.95,0.99
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Métricas customizadas
metrics.slow.ms=2000
metrics.business-hours.start=6
metrics.business-hours.end=20